<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🍎 单词消消乐</title>
<style>
  :root {
    --bg1: #fff1f7;
    --bg2: #e8f7ff;
    --card-bg: #ffffff;
    --en-bg: #ffe9f0;
    --en-border: #ff9ec4;
    --cn-bg: #e8f6ff;
    --cn-border: #7fc9ff;
    --selected-bg: #fff7cc;
    --selected-border: #ffc83d;
    --text: #4a3b52;
    --accent: #ff6f9c;
    --shadow: 0 4px 10px rgba(120, 80, 130, 0.15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
  }
  header { text-align: center; margin-bottom: 8px; }
  header h1 { margin: 4px 0; font-size: 28px; }
  header p { margin: 0; font-size: 13px; opacity: 0.75; max-width: 560px; }

  .topbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.75);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 8px 12px;
    margin-bottom: 12px;
    width: 100%;
    max-width: 720px;
  }
  .badge {
    background: linear-gradient(135deg, #ffd3e3, #ffeccc);
    border-radius: 12px;
    padding: 6px 10px;
    font-weight: bold;
    font-size: 14px;
    white-space: nowrap;
  }
  select, button.btn {
    border: none;
    border-radius: 12px;
    padding: 7px 12px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    background: #fff;
    box-shadow: var(--shadow);
    color: var(--text);
    font-weight: bold;
  }
  select:active, button.btn:active { transform: scale(0.96); }
  button.btn.primary { background: linear-gradient(135deg, #ff9ec4, #ffb36b); color: #fff; }
  button.btn.off { opacity: 0.5; }
  .stats { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .stat {
    background: #eefaff;
    border-radius: 12px;
    padding: 6px 10px;
    font-size: 13px;
    white-space: nowrap;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    width: 100%;
    max-width: 720px;
    margin-bottom: 24px;
  }
  .card {
    border-radius: 16px;
    padding: 14px 8px;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: var(--shadow);
    border: 3px solid transparent;
    transition: transform 0.12s, border-color 0.15s, background 0.15s;
    user-select: none;
    word-break: break-word;
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card.en { background: var(--en-bg); border-color: var(--en-border); }
  .card.cn { background: var(--cn-bg); border-color: var(--cn-border); }
  .card.selected { background: var(--selected-bg); border-color: var(--selected-border); transform: scale(1.06); }
  .card.shake { animation: shake 0.4s; }
  .card.vanish { animation: vanish 0.45s forwards; pointer-events: none; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  @keyframes vanish {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.25) rotate(4deg); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }

  /* 过关弹窗 */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(80, 50, 90, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 24px;
    padding: 28px 32px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    animation: pop 0.35s;
    max-width: 90vw;
  }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    70% { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }
  .modal h2 { margin: 0 0 8px; font-size: 24px; }
  .modal p { margin: 6px 0; font-size: 15px; }
  .modal .btn { margin-top: 12px; font-size: 16px; padding: 10px 22px; }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(70, 50, 80, 0.85);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 20;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 480px) {
    #board { grid-template-columns: repeat(2, 1fr); }
    header h1 { font-size: 22px; }
    header p { font-size: 12px; }
    .card { font-size: 15px; padding: 12px 6px; }
  }
</style>
</head>
<body>
<header>
  <h1>🍎 单词消消乐</h1>
  <p>点英文卡配对中文卡，配对成功就"咻"地消掉！每关混进上一关 20% 的老词帮你巩固 🌟</p>
</header>

<div class="topbar">
  <span class="badge" id="levelBadge">🏅 第 1 关</span>
  <select id="dictSelect" title="选择词表">
    <option value="san3">📚 三上</option>
  </select>
  <button class="btn" id="uploadBtn">📤 上传词表</button>
  <input type="file" id="fileInput" accept=".txt,.csv" hidden>
  <button class="btn primary" id="restartBtn">🔄 重新开始</button>
  <button class="btn" id="soundBtn">🔊 发音：开</button>
  <div class="stats">
    <span class="stat" id="timeStat">⏱ 0s</span>
    <span class="stat" id="doneStat">✅ 0/0</span>
    <span class="stat" id="tryStat">🎯 0</span>
  </div>
</div>

<div id="board"></div>

<div id="overlay">
  <div class="modal">
    <h2 id="modalTitle">🎉 过关啦！</h2>
    <p id="modalInfo"></p>
    <button class="btn primary" id="nextBtn">➡️ 下一关</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  /* ================= 数据 ================= */

  // 内置"三上"默认词表（≥40 对）
  var DEFAULT_DICT = [
    ["apple", "苹果"], ["banana", "香蕉"], ["cat", "猫"], ["dog", "狗"],
    ["book", "书"], ["pen", "钢笔"], ["school", "学校"], ["teacher", "老师"],
    ["student", "学生"], ["friend", "朋友"], ["water", "水"], ["eye", "眼睛"],
    ["ear", "耳朵"], ["nose", "鼻子"], ["mouth", "嘴巴"], ["hand", "手"],
    ["red", "红色"], ["blue", "蓝色"], ["yellow", "黄色"], ["green", "绿色"],
    ["one", "一"], ["two", "二"], ["three", "三"], ["four", "四"],
    ["five", "五"], ["six", "六"], ["seven", "七"], ["eight", "八"],
    ["nine", "九"], ["ten", "十"], ["tiger", "老虎"], ["elephant", "大象"],
    ["monkey", "猴子"], ["panda", "熊猫"], ["bird", "鸟"], ["fish", "鱼"],
    ["bread", "面包"], ["milk", "牛奶"], ["egg", "鸡蛋"], ["rice", "米饭"],
    ["juice", "果汁"], ["cake", "蛋糕"], ["bag", "书包"], ["pencil", "铅笔"],
    ["ruler", "尺子"], ["eraser", "橡皮"], ["crayon", "蜡笔"]
  ];

  var PAIRS_PER_LEVEL = 8;   // 每关对数
  var OLD_RATIO = 0.2;       // 旧词混入比例

  // 游戏状态
  var dicts = { "san3": DEFAULT_DICT }; // 所有词表 { name: [[en, cn], ...] }
  var currentDictName = "san3";
  var level = 1;
  var lastLevelPairs = [];   // 上一关的词对（用于混入旧词）
  var selectedEn = null;     // 当前选中的英文卡 { key, el }
  var selectedCn = null;
  var locked = false;        // 动画期间锁定点击
  var eliminated = 0;        // 已消除对数
  var totalPairs = 0;        // 本关总对数
  var attempts = 0;          // 尝试次数
  var startTime = 0;
  var timerId = null;
  var soundOn = true;

  /* ================= DOM ================= */

  var $ = function (id) { return document.getElementById(id); };
  var board = $("board");
  var levelBadge = $("levelBadge");
  var dictSelect = $("dictSelect");
  var timeStat = $("timeStat");
  var doneStat = $("doneStat");
  var tryStat = $("tryStat");
  var overlay = $("overlay");
  var modalInfo = $("modalInfo");
  var nextBtn = $("nextBtn");
  var toast = $("toast");
  var fileInput = $("fileInput");

  /* ================= 工具函数 ================= */

  /** Fisher-Yates 洗牌，返回新数组 */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(function () { toast.classList.remove("show"); }, 1800);
  }

  /** 朗读英文单词 */
  function speak(text) {
    if (!soundOn || !("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    } catch (e) { /* 忽略发音错误 */ }
  }

  function formatTime(sec) {
    if (sec < 60) return sec + "s";
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + "分" + s + "秒";
  }

  function updateStats() {
    doneStat.textContent = "✅ " + eliminated + "/" + totalPairs;
    tryStat.textContent = "🎯 " + attempts;
  }

  function startTimer() {
    stopTimer();
    startTime = Date.now();
    timerId = setInterval(function () {
      timeStat.textContent = "⏱ " + formatTime(Math.floor((Date.now() - startTime) / 1000));
    }, 500);
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  /* ================= 词表选择 ================= */

  function rebuildDictSelect() {
    dictSelect.innerHTML = "";
    Object.keys(dicts).forEach(function (name) {
      var opt = document.createElement("option");
      opt.value = name;
      opt.textContent = "📚 " + name;
      dictSelect.appendChild(opt);
    });
    if (!dicts[currentDictName]) currentDictName = Object.keys(dicts)[0];
    dictSelect.value = currentDictName;
  }

  dictSelect.addEventListener("change", function () {
    currentDictName = dictSelect.value;
    level = 1;
    lastLevelPairs = [];
    startLevel();
  });

  /* ================= 上传词表 ================= */

  $("uploadBtn").addEventListener("click", function () { fileInput.click(); });

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var pairs = parseDictText(String(reader.result || ""));
      if (pairs.length < PAIRS_PER_LEVEL) {
        showToast("词表至少需要 " + PAIRS_PER_LEVEL + " 对，当前只有 " + pairs.length + " 对");
        return;
      }
      var name = file.name.replace(/\.(txt|csv)$/i, "") || "自定义";
      // 避免重名覆盖：重名则追加序号
      var finalName = name, i = 2;
      while (dicts[finalName]) { finalName = name + i; i++; }
      dicts[finalName] = pairs;
      rebuildDictSelect();
      currentDictName = finalName;
      dictSelect.value = finalName;
      level = 1;
      lastLevelPairs = [];
      startLevel();
      showToast("词表「" + finalName + "」加载成功，共 " + pairs.length + " 对");
    };
    reader.onerror = function () { showToast("读取文件失败，请重试"); };
    reader.readAsText(file, "UTF-8");
    fileInput.value = "";
  });

  /** 解析"英文,中文"文本（支持中英文逗号、制表符；忽略空行与单列行） */
  function parseDictText(text) {
    var pairs = [];
    var seen = {};
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var parts = line.split(/[,，\t]/).map(function (s) { return s.trim(); });
      if (parts.length < 2 || !parts[0] || !parts[1]) continue;
      var en = parts[0], cn = parts[1];
      var key = en.toLowerCase() + "|" + cn;
      if (seen[key]) continue; // 去重
      seen[key] = true;
      pairs.push([en, cn]);
    }
    return pairs;
  }

  /* ================= 关卡生成 ================= */

  /** 生成新一关的词对：8 对，第 2 关起混入上一关约 20% 旧词 */
  function buildLevelPairs() {
    var pool = dicts[currentDictName] || DEFAULT_DICT;
    var nOld = 0;
    if (level >= 2 && lastLevelPairs.length > 0) {
      nOld = Math.max(1, Math.round(PAIRS_PER_LEVEL * OLD_RATIO));
      nOld = Math.min(nOld, lastLevelPairs.length, PAIRS_PER_LEVEL - 1);
    }
    var oldPairs = shuffle(lastLevelPairs).slice(0, nOld);
    var usedKeys = {};
    oldPairs.forEach(function (p) { usedKeys[p[0].toLowerCase()] = true; });

    // 从池中取新词（排除本关已用的旧词）
    var fresh = shuffle(pool).filter(function (p) { return !usedKeys[p[0].toLowerCase()]; });
    var nNew = PAIRS_PER_LEVEL - oldPairs.length;
    // 池中剩余不足时，允许旧词补位（先把池里所有可用的都用上）
    var newPairs = fresh.slice(0, nNew);
    newPairs.forEach(function (p) { usedKeys[p[0].toLowerCase()] = true; });
    if (newPairs.length < nNew) {
      // 词表不足：用剩余旧词补齐（排除所有已选词，避免重复）
      var moreOld = shuffle(lastLevelPairs).filter(function (p) {
        return !usedKeys[p[0].toLowerCase()];
      });
      newPairs = newPairs.concat(moreOld.slice(0, nNew - newPairs.length));
    }
    return shuffle(oldPairs.concat(newPairs)).slice(0, PAIRS_PER_LEVEL);
  }

  /* ================= 棋盘渲染 ================= */

  function renderBoard(pairs) {
    board.innerHTML = "";
    selectedEn = null;
    selectedCn = null;
    locked = false;
    eliminated = 0;
    attempts = 0;
    totalPairs = pairs.length;

    // 英文卡与中文卡分别洗牌后插入 DOM
    var enCards = shuffle(pairs.map(function (p, i) { return { key: i, text: p[0] }; }));
    var cnCards = shuffle(pairs.map(function (p, i) { return { key: i, text: p[1] }; }));

    enCards.forEach(function (c) { board.appendChild(makeCard(c, "en")); });
    cnCards.forEach(function (c) { board.appendChild(makeCard(c, "cn")); });
    updateStats();
  }

  function makeCard(c, kind) {
    var el = document.createElement("div");
    el.className = "card " + kind;
    el.textContent = c.text;
    el.dataset.key = String(c.key);
    el.dataset.kind = kind;
    el.addEventListener("click", function () { onCardClick(el); });
    return el;
  }

  /* ================= 交互逻辑 ================= */

  function onCardClick(el) {
    if (locked || el.classList.contains("vanish")) return;

    if (el.dataset.kind === "en") {
      if (selectedEn && selectedEn.el === el) { // 取消选中
        el.classList.remove("selected");
        selectedEn = null;
        return;
      }
      if (selectedEn) selectedEn.el.classList.remove("selected");
      selectedEn = { key: el.dataset.key, el: el };
      el.classList.add("selected");
      speak(el.textContent);
    } else {
      if (selectedCn && selectedCn.el === el) {
        el.classList.remove("selected");
        selectedCn = null;
        return;
      }
      if (selectedCn) selectedCn.el.classList.remove("selected");
      selectedCn = { key: el.dataset.key, el: el };
      el.classList.add("selected");
    }

    // 两边都选中 → 判定
    if (selectedEn && selectedCn) {
      attempts++;
      updateStats();
      if (selectedEn.key === selectedCn.key) {
        matchSuccess();
      } else {
        matchFail();
      }
    }
  }

  function matchSuccess() {
    locked = true;
    var enEl = selectedEn.el, cnEl = selectedCn.el;
    selectedEn = null;
    selectedCn = null;
    enEl.classList.add("vanish");
    cnEl.classList.add("vanish");
    setTimeout(function () {
      enEl.remove();
      cnEl.remove();
      eliminated++;
      updateStats();
      locked = false;
      if (eliminated >= totalPairs) levelComplete();
    }, 480);
  }

  function matchFail() {
    locked = true;
    var enEl = selectedEn.el, cnEl = selectedCn.el;
    selectedEn = null;
    selectedCn = null;
    enEl.classList.add("shake");
    cnEl.classList.add("shake");
    setTimeout(function () {
      enEl.classList.remove("selected", "shake");
      cnEl.classList.remove("selected", "shake");
      locked = false;
    }, 420);
  }

  /* ================= 关卡流程 ================= */

  function startLevel() {
    var pairs = buildLevelPairs();
    lastLevelPairs = pairs.slice(); // 记住本关词对，供下一关混入旧词
    levelBadge.textContent = "🏅 第 " + level + " 关";
    timeStat.textContent = "⏱ 0s";
    renderBoard(pairs);
    startTimer();
  }

  function levelComplete() {
    stopTimer();
    var usedSec = Math.floor((Date.now() - startTime) / 1000);
    modalInfo.textContent = "⏱ 用时 " + formatTime(usedSec) + " · 🎯 尝试 " + attempts + " 次";
    overlay.classList.add("show");
  }

  nextBtn.addEventListener("click", function () {
    overlay.classList.remove("show");
    level++;
    startLevel();
  });

  /* ================= 顶栏按钮 ================= */

  $("restartBtn").addEventListener("click", function () {
    overlay.classList.remove("show");
    level = 1;
    lastLevelPairs = [];
    startLevel();
  });

  $("soundBtn").addEventListener("click", function () {
    soundOn = !soundOn;
    var btn = $("soundBtn");
    btn.textContent = soundOn ? "🔊 发音：开" : "🔇 发音：关";
    btn.classList.toggle("off", !soundOn);
    if (!soundOn && "speechSynthesis" in window) window.speechSynthesis.cancel();
  });

  /* ================= 启动 ================= */

  rebuildDictSelect();
  startLevel();
})();
</script>
</body>
</html>
